name: Keep GitHub Pages Disabled

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  disable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      administration: write
    steps:
      - name: Disable GitHub Pages if enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(gh api repos/${{ github.repository }}/pages --silent 2>&1 || echo "NOT_FOUND")
          if echo "$STATUS" | grep -q "NOT_FOUND\|404"; then
            echo "GitHub Pages already disabled. Nothing to do."
          else
            echo "GitHub Pages is ENABLED — disabling now."
            gh api --method DELETE repos/${{ github.repository }}/pages
            echo "GitHub Pages disabled successfully."
          fi
